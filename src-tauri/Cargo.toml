[package]
name = "peerdrop"
version = "0.1.0"
description = "P2P file sharing app"
authors = ["yanntongui"]
edition = "2021"

[lib]
name = "peerdrop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
